# Blueprint de Render para desplegar el sistema gratis con un click:
# https://dashboard.render.com/blueprints (o el botón "Deploy to Render" del README).
#
# Crea 3 servicios:
# - Base de datos PostgreSQL (plan free)
# - API (NestJS, plan free)
# - Frontend (sitio estático, plan free)
#
# Las URLs entre servicios se resuelven solas (fromService), no hace falta
# copiar ni pegar nada a mano.

databases:
  - name: hotel-pms-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: hotel-pms-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run build -w apps/api
    startCommand: npm run prisma:deploy && npm run prisma:seed && node apps/api/dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-pms-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: hotel-pms-web
          property: host

  - type: web
    name: hotel-pms-web
    runtime: static
    buildCommand: npm install --include=dev && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hotel-pms-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
